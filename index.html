<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okuma Köşesi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9e2a2b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Okuma Köşesi">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Yeseva+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* Plan: a warm reading room. Library -> book page -> reader, like a serial-fiction app, sized large for an older reader.
   The reader picks the theme (Gündüz / Sepya / Gece); the whole app follows it. */
:root {
  --bg: #f4ecdf;
  --surface: #fbf6ee;
  --ink: #2b2420;
  --muted: #7a6a5c;
  --line: #e2d5c3;
  --accent: #9e2a2b;
  --accent-ink: #fff8f0;
  --font-display: "Yeseva One", Georgia, serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: 20px;
  color-scheme: light;
}
:root[data-okuma="gunduz"] {
  --bg: #f7f5f2; --surface: #ffffff; --ink: #1f1c1a; --muted: #6d6660; --line: #e6e1db;
  --accent: #9e2a2b; --accent-ink: #ffffff; color-scheme: light;
}
:root[data-okuma="gece"] {
  --bg: #15171c; --surface: #1e2128; --ink: #e6e1d8; --muted: #9a958c; --line: #2e323b;
  --accent: #e07a6a; --accent-ink: #1a0f0d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }
.view { display: none; }
.view.on { display: block; }

/* header */
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 58px; }
.brand { font-family: var(--font-display); font-size: 24px; letter-spacing: .01em; flex: 1; margin: 0; }
.iconbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  min-width: 46px; height: 46px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 600; font-size: 16px;
}
.toptitle { flex: 1; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* home */
.hello { padding: 22px 0 6px; }
.hello h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0 0 4px; text-wrap: balance; }
.hello p { margin: 0; color: var(--muted); }
.continue {
  display: flex; gap: 14px; align-items: center; margin: 18px 0 8px; padding: 14px;
  background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 14px;
  width: 100%; text-align: left;
}
.continue .mini { width: 56px; flex: none; }
.continue b { display: block; font-size: 17px; }
.continue span { color: var(--muted); font-size: 15px; }
.continue .go { margin-left: auto; font-weight: 700; color: var(--accent); white-space: nowrap; }
.section-h { font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 26px 0 12px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; padding-bottom: 40px; }
.bookcard { border: 0; background: none; padding: 0; text-align: left; }
.bookcard .t { font-weight: 700; margin-top: 8px; font-size: 16px; line-height: 1.3; }
.bookcard .m { color: var(--muted); font-size: 14px; }

/* cover */
.cover {
  position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden;
  background: linear-gradient(180deg, #1b2535 0%, #3b4a63 55%, #c9d3df 100%);
  box-shadow: 0 6px 18px rgba(0,0,0,.22); color: #fff;
}
.cover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover .ct {
  position: absolute; left: 0; right: 0; top: 16%; text-align: center;
  font-family: var(--font-display); line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,.5);
  font-size: clamp(17px, 17cqw, 46px); padding: 0 8%;
}
.cover .ct small { display: block; font-family: var(--font-ui); font-size: .32em; letter-spacing: .3em; margin-bottom: .5em; opacity: .9; }
.cover { container-type: inline-size; }

/* book page */
.bookhead { display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 22px 0 8px; align-items: end; }
.bookhead h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
.bookhead .by { color: var(--muted); margin: 0 0 10px; }
.stats { display: flex; gap: 16px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.tag { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
.blurb { font-family: var(--font-body); font-size: 18px; line-height: 1.65; }
.blurb p { margin: 0 0 .9em; }
.blurb.short { max-height: 13em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 6px 0; }
.primary {
  display: block; width: 100%; margin: 18px 0 6px; padding: 16px; border: 0; border-radius: 14px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 19px;
}
.chapters { list-style: none; margin: 0 0 50px; padding: 0; border-top: 1px solid var(--line); }
.chapters li button {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: none; padding: 16px 4px; font-size: 17px;
}
.chapters .no { font-variant-numeric: tabular-nums; color: var(--muted); width: 2.2em; flex: none; }
.chapters .nm { flex: 1; }
.chapters .st { font-size: 14px; color: var(--muted); }
.chapters .done .nm { color: var(--muted); }
.chapters .cur .st { color: var(--accent); font-weight: 700; }
.chapters .soon { color: var(--muted); padding: 16px 4px; font-style: italic; border-bottom: 1px solid var(--line); }

/* reader */
.progress { height: 3px; background: var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); }
.reader { font-family: var(--font-body); font-size: var(--fs); line-height: 1.75; max-width: 34em; margin: 0 auto; padding: 26px 20px 30px; }
.reader h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.45em; line-height: 1.2; margin: .4em 0 .2em; text-align: center; text-wrap: balance; }
.reader .chno { text-align: center; color: var(--muted); font-family: var(--font-ui); font-size: .7em; letter-spacing: .25em; text-transform: uppercase; }
.reader p { margin: 0 0 1em; }
.reader .pov { font-family: var(--font-ui); font-weight: 700; letter-spacing: .12em; font-size: .75em; color: var(--accent); margin-top: 1.6em; }
.reader .brk { text-align: center; color: var(--muted); letter-spacing: .6em; margin: 1.6em 0; }
.reader .end { text-align: center; color: var(--muted); font-style: italic; margin-top: 2em; }
.readnav { display: flex; gap: 12px; max-width: 34em; margin: 0 auto; padding: 0 20px 60px; }
.readnav button { flex: 1; padding: 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 17px; }
.readnav .next { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.readnav button:disabled { opacity: .45; cursor: default; }
.waitnote { max-width: 34em; margin: -30px auto 60px; padding: 0 20px; text-align: center; color: var(--muted); }

/* settings sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: none;
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
  padding: 20px 20px 28px; box-shadow: 0 -8px 30px rgba(0,0,0,.2);
}
.sheet.on, .sheet-bg.on { display: block; }
.sheet .in { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
.sheet h3 { margin: 0; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; }
.row .val { flex: 1; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.row button { flex: 1; padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; }
.row .size-s { font-size: 16px; } .row .size-l { font-size: 24px; }
.theme-g { background: #ffffff !important; color: #1f1c1a !important; }
.theme-s { background: #f4ecdf !important; color: #2b2420 !important; }
.theme-n { background: #15171c !important; color: #e6e1d8 !important; }
.row button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }

@media (max-width: 420px) {
  .bookhead { grid-template-columns: 120px 1fr; gap: 14px; }
  .bookhead h2 { font-size: 25px; }
}
</style>
</head>
<body>

<!-- HOME -->
<section id="v-home" class="view">
  <header class="topbar"><div class="wrap">
    <h1 class="brand">Okuma Köşesi</h1>
    <button class="iconbtn" data-open-settings aria-label="Okuma ayarları">Aa</button>
  </div></header>
  <div class="wrap">
    <div class="hello">
      <h2 id="greet">Hoş geldin</h2>
      <p>Bütün hikâyeler senin için yazıldı. Bölümler ücretsiz, coin yok.</p>
    </div>
    <div id="continue-slot"></div>
    <div class="section-h">Kitaplık</div>
    <div class="shelf" id="shelf"></div>
  </div>
</section>

<!-- BOOK -->
<section id="v-book" class="view">
  <header class="topbar"><div class="wrap">
    <button class="iconbtn" data-go="home" aria-label="Kitaplığa dön">‹ Kitaplık</button>
    <div class="toptitle"></div>
    <button class="iconbtn" data-open-settings aria-label="Okuma ayarları">Aa</button>
  </div></header>
  <div class="wrap" id="book-body"></div>
</section>

<!-- READER -->
<section id="v-read" class="view">
  <header class="topbar">
    <div class="wrap">
      <button class="iconbtn" id="back-book" aria-label="Bölüm listesine dön">‹</button>
      <div class="toptitle" id="read-title"></div>
      <button class="iconbtn" data-open-settings aria-label="Okuma ayarları">Aa</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
  </header>
  <article class="reader" id="reader"></article>
  <nav class="readnav">
    <button id="prev">‹ Önceki</button>
    <button id="next" class="next">Sonraki bölüm ›</button>
  </nav>
  <p class="waitnote" id="waitnote" hidden>Yeni bölüm yakında geliyor.</p>
</section>

<!-- SETTINGS -->
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Okuma ayarları">
  <div class="in">
    <h3>Yazı boyutu</h3>
    <div class="row">
      <button class="size-s" id="fs-down" aria-label="Yazıyı küçült">A−</button>
      <div class="val" id="fs-val">20</div>
      <button class="size-l" id="fs-up" aria-label="Yazıyı büyüt">A+</button>
    </div>
    <h3>Renk</h3>
    <div class="row" id="themes">
      <button class="theme-g" data-theme-pick="gunduz">Gündüz</button>
      <button class="theme-s" data-theme-pick="sepya">Sepya</button>
      <button class="theme-n" data-theme-pick="gece">Gece</button>
    </div>
    <button class="primary" id="sheet-close" style="margin:0">Tamam</button>
  </div>
</div>

<script>
let LIB = [];

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ak_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ak_" + k, JSON.stringify(v)); } catch (e) {} }
};
let prefs = Object.assign({ fs: 20, theme: "sepya" }, store.get("prefs", {}));
let progress = store.get("progress", {});   // { bookId: { ch: index, done: [..], pos: 0..1 } }
let last = store.get("last", null);          // bookId

function applyPrefs() {
  document.documentElement.dataset.okuma = prefs.theme;
  document.documentElement.style.setProperty("--fs", prefs.fs + "px");
  document.getElementById("fs-val").textContent = prefs.fs;
  document.querySelectorAll("[data-theme-pick]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themePick === prefs.theme));
  store.set("prefs", prefs);
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<em>$1</em>");
const book = id => LIB.find(b => b.id === id);
const prog = id => (progress[id] = progress[id] || { ch: 0, done: [], pos: 0 });

function coverHTML(b) {
  return `<div class="cover" aria-hidden="true" style="background:${b.bg}">
    <svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMax slice">${b.art}</svg>
    <div class="ct"><small>${esc(b.kicker)}</small>${esc(b.title)}</div>
  </div>`;
}

/* ---------- views ---------- */
function show(v) {
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
}

function renderHome() {
  show("home");
  $("#shelf").innerHTML = LIB.map(b => `
    <button class="bookcard" data-book="${b.id}">
      ${coverHTML(b)}
      <div class="t">${esc(b.title)}</div>
      <div class="m">${b.chapters.length} bölüm · ${esc(b.status)}</div>
    </button>`).join("");
  const slot = $("#continue-slot");
  const lb = last && book(last);
  if (lb) {
    const p = prog(lb.id);
    const ch = lb.chapters[p.ch];
    slot.innerHTML = `<button class="continue" data-read="${lb.id}" data-ch="${p.ch}">
      <div class="mini">${coverHTML(lb)}</div>
      <div><b>${esc(lb.title)}</b><span>Bölüm ${p.ch + 1}: ${esc(ch.title)}</span></div>
      <div class="go">Devam et ›</div></button>`;
  } else slot.innerHTML = "";
  window.scrollTo(0, 0);
}

function renderBook(id) {
  const b = book(id); if (!b) return renderHome();
  show("book");
  $("#v-book .toptitle").textContent = b.title;
  const p = prog(id);
  const started = p.done.length > 0 || p.pos > 0.02 || p.ch > 0;
  const blurb = b.blurb.map(x => `<p>${inline(x)}</p>`).join("");
  $("#book-body").innerHTML = `
    <div class="bookhead">
      ${coverHTML(b)}
      <div>
        <h2>${esc(b.title)}</h2>
        <p class="by">${esc(b.author)}</p>
        <div class="stats"><span><b>${b.chapters.length}</b> bölüm</span><span>${esc(b.status)}</span></div>
      </div>
    </div>
    <div class="tags">${b.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div class="blurb short" id="blurb">${blurb}</div>
    <button class="linkbtn" id="more">Tanıtımın devamını oku</button>
    <button class="primary" data-read="${id}" data-ch="${started ? p.ch : 0}">
      ${started ? `Bölüm ${p.ch + 1}'den devam et` : "Okumaya başla"}</button>
    <div class="section-h">Bölümler</div>
    <ul class="chapters">
      ${b.chapters.map((c, i) => {
        const done = p.done.includes(i), cur = started && i === p.ch && !done;
        return `<li class="${done ? "done" : ""} ${cur ? "cur" : ""}"><button data-read="${id}" data-ch="${i}">
          <span class="no">${i + 1}.</span><span class="nm">${esc(c.title)}</span>
          <span class="st">${done ? "Okundu ✓" : cur ? "Kaldığın yer" : ""}</span></button></li>`;
      }).join("")}
      ${b.status === "Devam ediyor" ? `<li class="soon">Yeni bölümler yakında…</li>` : ""}
    </ul>`;
  $("#more").onclick = () => { $("#blurb").classList.remove("short"); $("#more").remove(); };
  window.scrollTo(0, 0);
}

let cur = null;
function renderRead(id, i) {
  const b = book(id); if (!b) return renderHome();
  i = Math.max(0, Math.min(i, b.chapters.length - 1));
  const c = b.chapters[i];
  show("read");
  cur = { id, i };
  last = id; store.set("last", last);
  const p = prog(id);
  if (p.ch !== i) { p.ch = i; p.pos = 0; }
  store.set("progress", progress);
  $("#read-title").textContent = b.title;
  $("#reader").innerHTML = `<div class="chno">Bölüm ${i + 1}</div><h2>${esc(c.title)}</h2>` +
    c.body.map(x => x.t === "brk" ? `<div class="brk" aria-hidden="true">✦ ✦ ✦</div>`
      : x.t === "pov" ? `<p class="pov">${inline(x.s)}</p>`
      : `<p>${inline(x.s)}</p>`).join("") + `<p class="end">— Bölüm sonu —</p>`;
  $("#prev").disabled = i === 0;
  const isLast = i === b.chapters.length - 1;
  $("#next").disabled = isLast;
  $("#next").textContent = isLast ? "Son bölüm" : "Sonraki bölüm ›";
  $("#waitnote").hidden = !(isLast && b.status === "Devam ediyor");
  requestAnimationFrame(() => {
    const max = document.documentElement.scrollHeight - innerHeight;
    window.scrollTo(0, p.pos > 0 ? p.pos * max : 0);
    onScroll();
  });
}

function onScroll() {
  if (!cur || !$("#v-read").classList.contains("on")) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  const f = max > 0 ? Math.min(1, scrollY / max) : 1;
  $("#prog").style.width = (f * 100) + "%";
  const p = prog(cur.id);
  p.pos = f;
  if (f > 0.92 && !p.done.includes(cur.i)) p.done.push(cur.i);
  store.set("progress", progress);
}
let st; addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(onScroll, 120); }, { passive: true });

/* ---------- routing on plain #names ---------- */
function route() {
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^oku-([a-z0-9]+)-(\d+)$/))) renderRead(m[1], +m[2] - 1);
  else if ((m = h.match(/^kitap-([a-z0-9]+)$/))) renderBook(m[1]);
  else renderHome();
}
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.book) go("kitap-" + t.dataset.book);
  else if (t.dataset.read) go(`oku-${t.dataset.read}-${+t.dataset.ch + 1}`);
  else if (t.dataset.go === "home") go("ana");
  else if (t.hasAttribute("data-open-settings")) { $("#sheet").classList.add("on"); $("#sheet-bg").classList.add("on"); }
  else if (t.dataset.themePick) { prefs.theme = t.dataset.themePick; applyPrefs(); }
});
$("#back-book").onclick = () => cur && go("kitap-" + cur.id);
$("#prev").onclick = () => cur && go(`oku-${cur.id}-${cur.i}`);
$("#next").onclick = () => {
  if (!cur) return;
  const p = prog(cur.id); if (!p.done.includes(cur.i)) p.done.push(cur.i);
  store.set("progress", progress);
  go(`oku-${cur.id}-${cur.i + 2}`);
};
const closeSheet = () => { $("#sheet").classList.remove("on"); $("#sheet-bg").classList.remove("on"); };
$("#sheet-close").onclick = closeSheet; $("#sheet-bg").onclick = closeSheet;
$("#fs-down").onclick = () => { prefs.fs = Math.max(16, prefs.fs - 2); applyPrefs(); };
$("#fs-up").onclick = () => { prefs.fs = Math.min(30, prefs.fs + 2); applyPrefs(); };

applyPrefs();
fetch("stories.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(d => { LIB = d; route(); })
  .catch(() => { document.getElementById("shelf").innerHTML = "<p>Hikâyeler yüklenemedi. İnternete bağlanıp uygulamayı yeniden aç.</p>"; show("home"); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
